; Доп. пул www для Битрикс (под VPS ~8 CPU / 12 GiB RAM; при нехватке памяти уменьшите pm.max_children).
[www]
; Иначе getenv() / $_SERVER в PHP-FPM не видят переменные из Docker (env_file), и Битрикс берёт неверный пароль БД.
clear_env = no
pm = dynamic
pm.max_children = 28
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 14
pm.max_requests = 400
request_terminate_timeout = 300s
catch_workers_output = yes
