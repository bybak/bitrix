; Доп. пул www для Битрикс (под VPS ~8 CPU / 12 GiB RAM; при нехватке памяти уменьшите pm.max_children).
[www]
; Иначе getenv() / $_SERVER в PHP-FPM не видят переменные из Docker (env_file), и Битрикс берёт неверный пароль БД.
clear_env = no
pm = dynamic
pm.max_children = 28
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 14
pm.max_requests = 400

; Было 300s — воркер убивался через 5 мин даже при set_time_limit(0); фоновый импорт внешнего прайса
; (сотни тыс. строк + post-processing sync/recalc) не успевал завершиться.
; 0 = лимит отключён (см. php-fpm request_terminate_timeout). На проде при политике «жёсткий потолок»
; можно задать, например, 7200s.
request_terminate_timeout = 0
catch_workers_output = yes
