version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bitrix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./www:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - bitrix

  # Локальный SMTP+веб-просмотр писем. На Apple Silicon у официального Mailhog нет arm64 —
  # был warning linux/amd64 и возможны сбои. Mailpit — тот же сценарий (1025/8025), multi-arch.
  # Письма НЕ уходят в интернет: смотреть http://localhost:8025
  mailhog:
    image: axllent/mailpit:latest
    container_name: bitrix_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - bitrix

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: bitrix_php
    restart: unless-stopped
    working_dir: /var/www/html
    user: www-data
    env_file:
      - ./.env
    environment:
      TZ: Europe/Moscow
      MF_UNF_ENABLED: "1"
      # HTTP service in 1C: /unf/hs/<ROOT_URL>/<template>
      # По твоей конфигурации ROOT_URL = orders, шаблон = /create, метод = POST
      MF_UNF_ENDPOINT: "http://95.161.174.134:25555/unf/hs/orders/create"
      MF_UNF_PAID_ENDPOINT: "http://95.161.174.134:25555/unf/hs/orders/update"
      MF_UNF_TIMEOUT: "10"
      MF_UNF_LOG: "1"
      MF_UNF_OPERATION: "Заказ на продажу"
      MF_UNF_TAXATION: "Не облагается (без НДС)"
    volumes:
      - ./www:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitrix

  mysql:
    image: mysql:8.0
    container_name: bitrix_mysql
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      MYSQL_ROOT_PASSWORD: levampass
      MYSQL_DATABASE: bitrix_motor_force
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/bitrix.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --sql_mode="NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plevampass"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

networks:
  bitrix:
    driver: bridge

volumes:
  mysql_data:
    driver: local

