services:
  nginx:
    image: nginx:alpine
    container_name: bitrix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./www:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/includes:/etc/nginx/conf.d/includes:ro
      # ssl.conf — только на проде (docker-compose.prod.yml), не монтировать conf.d целиком:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/www:/var/www/certbot:ro
      - ./storage/oem-diagrams:/var/www/oem-diagrams:ro
      # /etc/letsencrypt — только на проде, см. docker-compose.prod.yml
    depends_on:
      - php
    networks:
      - bitrix

  # Локальный SMTP+веб-просмотр писем. На Apple Silicon у официального Mailhog нет arm64 —
  # был warning linux/amd64 и возможны сбои. Mailpit — тот же сценарий (1025/8025), multi-arch.
  # Письма НЕ уходят в интернет: смотреть http://localhost:8025
  mailhog:
    image: axllent/mailpit:latest
    container_name: bitrix_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - bitrix

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: bitrix_php
    restart: unless-stopped
    working_dir: /var/www/html
    user: www-data
    env_file:
      - ./.env
    environment:
      TZ: Europe/Moscow
      MF_UNF_ENABLED: "1"
      # HTTP service in 1C: /unf/hs/<ROOT_URL>/<template>
      # По твоей конфигурации ROOT_URL = orders, шаблон = /create, метод = POST
      MF_UNF_ENDPOINT: "http://95.161.174.134:25555/unf/hs/orders/create"
      MF_UNF_PAID_ENDPOINT: "http://95.161.174.134:25555/unf/hs/orders/update"
      MF_UNF_TIMEOUT: "10"
      MF_UNF_LOG: "1"
      MF_UNF_OPERATION: "Заказ на продажу"
      MF_UNF_TAXATION: "Не облагается (без НДС)"
      BITRIX_REDIS_HOST: redis
      BITRIX_REDIS_PORT: "6379"
      MF_MOTOR_FORCE_IMG_HOST: ${MF_MOTOR_FORCE_IMG_HOST:-/mf-img}
    volumes:
      - ./www:/var/www/html
      # Подмена без пересборки образа; важно для clear_env / getenv из .env в PHP-FPM
      - ./php-fpm-bitrix.conf:/usr/local/etc/php-fpm.d/zz-bitrix.conf:ro
      #- /opt/mail_ingest/drop:/var/www/html/supplier_drop:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bitrix

  # Агенты Bitrix (в т.ч. \\Mf\\Unf\\Agent::run — отправка заказов в 1С из mf_unf_queue).
  # Без периодического cron_events.php очередь остаётся в статусе new, пока кто-то не откроет сайт.
  bitrix_cron:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: bitrix_cron
    restart: unless-stopped
    working_dir: /var/www/html
    user: www-data
    env_file:
      - ./.env
    environment:
      TZ: Europe/Moscow
      MF_UNF_ENABLED: "1"
      MF_UNF_ENDPOINT: "http://95.161.174.134:25555/unf/hs/orders/create"
      MF_UNF_PAID_ENDPOINT: "http://95.161.174.134:25555/unf/hs/orders/update"
      MF_UNF_TIMEOUT: "10"
      MF_UNF_LOG: "1"
      MF_UNF_OPERATION: "Заказ на продажу"
      MF_UNF_TAXATION: "Не облагается (без НДС)"
    volumes:
      - ./www:/var/www/html
      - ./php-fpm-bitrix.conf:/usr/local/etc/php-fpm.d/zz-bitrix.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitrix
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          php -d short_open_tag=1 -f bitrix/modules/main/tools/cron_events.php || true
          sleep 60
        done

  oem_backend:
    build:
      context: ./oem_backend
      dockerfile: Dockerfile
    container_name: oem_backend
    restart: unless-stopped
    environment:
      OEM_DATABASE_DSN: postgresql://oem_user:oem_password@oem_db:5432/oem_catalog
      OEM_YAMAHA_DATABASE_DSN: postgresql://yamaha_user:yamaha_password@yamaha_db:5432/yamaha_catalog
      OEM_ARCTIC_DATABASE_DSN: postgresql://arctic_user:arctic_password@arctic_db:5432/arctic_catalog
      OEM_POLARIS_DATABASE_DSN: postgresql://polaris_user:polaris_password@polaris_db:5432/polaris_catalog
      OEM_REGISTRY_DATABASE_DSN: postgresql://oem_registry_user:oem_registry_password@oem_registry_db:5432/oem_registry
      OEM_ASSET_ROOT: /app/storage/oem-diagrams
      OEM_PUBLIC_ASSET_BASE_URL: /oem-assets
      OEM_HTTP_TIMEOUT: "20"
    volumes:
      - ./storage:/app/storage
      - ./oem_backend/app:/app/app:ro
      - ./oem_backend/db:/app/db:ro
    ports:
      - "8088:8000"
    depends_on:
      oem_db:
        condition: service_healthy
      yamaha_db:
        condition: service_healthy
      arctic_db:
        condition: service_healthy
      polaris_db:
        condition: service_healthy
      oem_registry_db:
        condition: service_healthy
    extra_hosts:
      - "partstream.arinet.com:67.208.136.218"
      - "parts.yamaha-motor.co.jp:45.60.14.31"
      # cdn.datamanager.arinet.com — не пинить CloudFront IP: мёртвый edge даёт 400 и обрывы.
      # ypec-sss (иллюстрации) — через обычный DNS/CloudFront, не фиксируем один IP.
    networks:
      - bitrix

  oem_db:
    image: postgres:16-alpine
    container_name: oem_db
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      POSTGRES_DB: oem_catalog
      POSTGRES_USER: oem_user
      POSTGRES_PASSWORD: oem_password
    volumes:
      - oem_pg_data:/var/lib/postgresql/data
      - ./oem_backend/db/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oem_user -d oem_catalog"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

  yamaha_db:
    image: postgres:16-alpine
    container_name: yamaha_db
    restart: unless-stopped
    shm_size: "512mb"
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: yamaha_catalog
      POSTGRES_USER: yamaha_user
      POSTGRES_PASSWORD: yamaha_password
    volumes:
      - yamaha_pg_data:/var/lib/postgresql/data
      - ./oem_backend/db/schema_postgres_yamaha.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamaha_user -d yamaha_catalog"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

  arctic_db:
    image: postgres:16-alpine
    container_name: arctic_db
    restart: unless-stopped
    shm_size: "512mb"
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: arctic_catalog
      POSTGRES_USER: arctic_user
      POSTGRES_PASSWORD: arctic_password
    volumes:
      - arctic_pg_data:/var/lib/postgresql/data
      - ./oem_backend/db/schema_postgres_arctic.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arctic_user -d arctic_catalog"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

  polaris_db:
    image: postgres:16-alpine
    container_name: polaris_db
    restart: unless-stopped
    shm_size: "512mb"
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: polaris_catalog
      POSTGRES_USER: polaris_user
      POSTGRES_PASSWORD: polaris_password
    volumes:
      - polaris_pg_data:/var/lib/postgresql/data
      - ./oem_backend/db/schema_postgres_polaris.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris_user -d polaris_catalog"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

  oem_registry_db:
    image: postgres:16-alpine
    container_name: oem_registry_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oem_registry
      POSTGRES_USER: oem_registry_user
      POSTGRES_PASSWORD: oem_registry_password
    volumes:
      - oem_registry_pg_data:/var/lib/postgresql/data
      - ./oem_backend/db/schema_postgres_registry.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oem_registry_user -d oem_registry"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

  mysql:
    image: mysql:8.0
    container_name: bitrix_mysql
    restart: unless-stopped
    # После смены пароля root выполняйте для ОБОИХ учёток (иначе PHP с сети Docker попадает в root@'%',
    # а «mysql -uroot» из этого контейнера — в root@'localhost', пароли могут разъехаться):
    #   ALTER USER 'root'@'localhost' IDENTIFIED BY '...';
    #   ALTER USER 'root'@'%' IDENTIFIED BY '...';
    #   FLUSH PRIVILEGES;
    environment:
      TZ: Europe/Moscow
      MYSQL_ROOT_PASSWORD: motorforceXgpyopxj1$
      MYSQL_DATABASE: bitrix_motor_force
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/bitrix.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --sql_mode="NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmotorforceXgpyopxj1$"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bitrix

  redis:
    image: redis:7-alpine
    container_name: bitrix_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bitrix

networks:
  bitrix:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  oem_pg_data:
    driver: local
  yamaha_pg_data:
    driver: local
  arctic_pg_data:
    driver: local
  polaris_pg_data:
    driver: local
  oem_registry_pg_data:
    driver: local

