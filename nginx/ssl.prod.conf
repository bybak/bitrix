# Продакшен SSL. Для локальной разработки этот файл НЕ подключается.
# На сервере: cp ssl.prod.conf ssl.conf  (или см. docker-compose.prod.yml)

server {
    listen 443 ssl;
    http2 on;
    server_name motor-force.ru www.motor-force.ru;

    ssl_certificate     /etc/letsencrypt/live/motor-force.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motor-force.ru/privkey.pem;

    include /etc/nginx/conf.d/includes/bitrix.conf;
}

server {
    listen 80;
    server_name motor-force.ru www.motor-force.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Старый поддомен опта — на основной сайт (путь и query сохраняются).
server {
    listen 80;
    server_name opt.motor-force.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://motor-force.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name opt.motor-force.ru;

    ssl_certificate     /etc/letsencrypt/live/motor-force.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motor-force.ru/privkey.pem;

    return 301 https://motor-force.ru$request_uri;
}
