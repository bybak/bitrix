# Продакшен SSL. Для локальной разработки этот файл НЕ подключается.
# На сервере: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Проверка: docker compose -f docker-compose.yml -f docker-compose.prod.yml exec nginx nginx -t

map $host $mf_https_host {
    opt.motor-force.ru    motor-force.ru;
    default               $host;
}

server {
    listen 443 ssl;
    http2 on;
    server_name motor-force.ru www.motor-force.ru;

    ssl_certificate     /etc/letsencrypt/live/motor-force.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motor-force.ru/privkey.pem;

    include /etc/nginx/conf.d/includes/bitrix.conf;
}

# opt → основной домен (нужен opt.motor-force.ru в сертификате, см. certbot --webroot ниже).
server {
    listen 443 ssl;
    http2 on;
    server_name opt.motor-force.ru;

    ssl_certificate     /etc/letsencrypt/live/motor-force.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motor-force.ru/privkey.pem;

    location / {
        return 301 https://motor-force.ru$request_uri;
    }
}

server {
    listen 80;
    server_name motor-force.ru www.motor-force.ru opt.motor-force.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$mf_https_host$request_uri;
    }
}
