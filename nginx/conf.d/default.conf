server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.php index.html;
    
    charset utf-8;
    client_max_body_size 128M;

    fastcgi_buffer_size 128k;
    fastcgi_buffers 8 256k;
    fastcgi_busy_buffers_size 256k;
    access_log /var/log/nginx/bitrix_access.log;
    error_log /var/log/nginx/bitrix_error.log;

    # Proxy Motor-Force images through local origin.
    # This avoids browser HSTS / TLS issues with img-motor-force.ru during local dev.
    location ^~ /mf-img/ {
        proxy_pass http://img-motor-force.ru/;
        proxy_set_header Host img-motor-force.ru;
        proxy_set_header Referer "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-MF-Proxy "1";
    }
    
    # Основное правило для Битрикс
    location / {
        try_files $uri $uri/ @bitrix;
    }
    
    location @bitrix {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
    
    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Долгие админские скрипты (импорт внешних прайсов и т.п.)
        fastcgi_read_timeout 7200;
    }
    
    # Запрет доступа к служебным файлам
    location ~ /\.ht {
        deny all;
    }
    
    location ~ /\.git {
        deny all;
    }
    
    # Битрикс специфичные правила
    location ~* ^/bitrix/admin.+\.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 7200;
    }
    
    location ~* ^/bitrix/tools.+\.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 7200;
    }
    
    # CSS/JS: кеш у браузера (ускорение); после выката — смена query-string у ассетов или purge CDN.
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Остальная статика: можно кешировать агрессивно
    location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|xml|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Запрет доступа к backup и другим служебным файлам
    location ~* (/\.htaccess|/\.git|/\.gitignore|/\.env|/composer\.json|/composer\.lock|/\.user\.ini) {
        deny all;
    }
}

