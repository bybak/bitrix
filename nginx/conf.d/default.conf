server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.php index.html;
    
    charset utf-8;
    client_max_body_size 64M;
    
    # Логи
    access_log /var/log/nginx/bitrix_access.log;
    error_log /var/log/nginx/bitrix_error.log;
    
    # Основное правило для Битрикс
    location / {
        try_files $uri $uri/ @bitrix;
    }
    
    location @bitrix {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
    
    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }
    
    # Запрет доступа к служебным файлам
    location ~ /\.ht {
        deny all;
    }
    
    location ~ /\.git {
        deny all;
    }
    
    # Битрикс специфичные правила
    location ~* ^/bitrix/admin.+\.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }
    
    location ~* ^/bitrix/tools.+\.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    
    # Кеширование статики
    location ~* \.(jpg|jpeg|gif|png|svg|webp|css|js|ico|xml|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Запрет доступа к backup и другим служебным файлам
    location ~* (/\.htaccess|/\.git|/\.gitignore|/\.env|/composer\.json|/composer\.lock|/\.user\.ini) {
        deny all;
    }
}

