root /var/www/html;
index index.php index.html;

charset utf-8;
client_max_body_size 128M;

fastcgi_buffer_size 128k;
fastcgi_buffers 8 256k;
fastcgi_busy_buffers_size 256k;
access_log /var/log/nginx/bitrix_access.log;
error_log /var/log/nginx/bitrix_error.log;

# Proxy Motor-Force images through local origin (HTTPS upstream — after certbot on img host HTTP returns 301).
location ^~ /mf-img/ {
    proxy_pass https://img-motor-force.ru/;
    proxy_set_header Host img-motor-force.ru;
    proxy_set_header Referer "";
    proxy_ssl_server_name on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    add_header X-MF-Proxy "1";
}

# OEM Schemas Catalog API. Use Docker DNS at request time so nginx can start
# even if the separate OEM backend is restarted independently.
resolver 127.0.0.11 valid=10s ipv6=off;
location ^~ /api/oem/ {
    set $oem_backend "oem_backend:8000";
    proxy_pass http://$oem_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# OEM diagram images on img-motor-force.ru (see /oem-assets/ → oem-diagrams/ there).
location ^~ /oem-assets/ {
    proxy_pass https://img-motor-force.ru/oem-assets/;
    proxy_set_header Host img-motor-force.ru;
    proxy_set_header Referer "";
    proxy_ssl_server_name on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ~* ^/local/components/bitrix/sale\.order\.ajax/.+\.(css|js)$ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
}

location / {
    try_files $uri $uri/ @bitrix;
}

location @bitrix {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param HTTPS $https;
    fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
    fastcgi_param DOCUMENT_ROOT $document_root;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param HTTPS $https;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 7200;
}

location ~ /\.ht {
    deny all;
}

location ~ /\.git {
    deny all;
}

location ~* ^/bitrix/admin.+\.php$ {
    try_files $uri =404;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param HTTPS $https;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 7200;
}

location ~* ^/bitrix/tools.+\.php$ {
    try_files $uri =404;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param HTTPS $https;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 7200;
}

location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# Sitemap генерируется динамически через Bitrix (urlrewrite.php), файла на диске нет.
location ~ ^/sitemap(?:-pages|-products-[0-9]+)?\.xml$ {
    try_files $uri @bitrix;
}

location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|xml|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location ~* (/\.htaccess|/\.git|/\.gitignore|/\.env|/composer\.json|/composer\.lock|/\.user\.ini) {
    deny all;
}
