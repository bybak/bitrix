server {
    listen 443 ssl http2;
    server_name motor-force.ru www.motor-force.ru;

    ssl_certificate     /etc/letsencrypt/live/motor-force.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motor-force.ru/privkey.pem;

    root /var/www/html;
    index index.php index.html;
    # ... остальные location — скопируйте из блока :80
}

server {
    listen 80;
    server_name motor-force.ru www.motor-force.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}