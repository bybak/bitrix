; PHP настройки для 1С-Битрикс

; Основные
memory_limit = 2048M
max_execution_time = 300
max_input_time = 300
post_max_size = 128M
upload_max_filesize = 128M
; Каталог для multipart (проверка «Загрузка файла» в site_checker); должен существовать и быть доступен для записи www-data.
upload_tmp_dir = /var/www/html/bitrix/upload_tmp

; Проверка системы Битрикс требует >= 60.
default_socket_timeout = 60

; Production: не выводить ошибки в HTML (нагрузка и утечки); логирование — в nginx/php-fpm.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; Часовой пояс
date.timezone = Europe/Moscow

; Сессии
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 1440
session.cookie_lifetime = 0

; OPcache (ядро Битрикс — много файлов; 128M часто упирается в лимит)
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 65407
; Проверка системы Битрикс требует 0. После выката кода — перезагрузка php-fpm (сброс OPcache).
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.enable_cli = 0
; PHP 8 JIT — умеренный режим; при странностях отключите (0).
opcache.jit = 1255
opcache.jit_buffer_size = 64M

; Безопасность
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Разное
short_open_tag = On
max_input_vars = 10000

; Mail (Docker): use msmtp as sendmail replacement
sendmail_path = "/usr/bin/msmtp -t"

