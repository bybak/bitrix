; PHP настройки для 1С-Битрикс

; Основные
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 64M
upload_max_filesize = 64M

; Production: не выводить ошибки в HTML (нагрузка и утечки); логирование — в nginx/php-fpm.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; Часовой пояс
date.timezone = Europe/Moscow

; Сессии
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 1440
session.cookie_lifetime = 0

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; Реже проверять mtime файлов (быстрее на проде; после деплоя — reload php-fpm).
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.enable_cli = 0

; Безопасность
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Разное
short_open_tag = On
max_input_vars = 10000

; Mail (Docker): use msmtp as sendmail replacement
sendmail_path = "/usr/bin/msmtp -t"

